[mutmut]
paths_to_mutate =
    packages/markitdown/src
    packages/markitdown-mcp/src
    packages/markitdown-sample-plugin/src
runner = python -m pytest /testbed/packages/markitdown-sample-plugin/test /testbed/packages/markitdown/test /testbed/packages/markitdown-mcp/test --import-mode=importlib --continue-on-collection-errors --timeout=2 -q --disable-warnings --tb=no
tests_dir =
    packages/markitdown-sample-plugin/test
    packages/markitdown/test 
    packages/markitdown-mcp/test
